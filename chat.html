```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI Interview Coach</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed,
                #9333ea
            );
        }

        .container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }

        .logo {

            text-align: center;

            margin-bottom: 25px;
        }

        .logo .icon {

            width: 65px;

            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #4f46e5;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }

        h1 {

            text-align: center;

            color: #1e1b4b;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 17px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.15);
        }

        .register-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {

            background: #3730a3;
        }

        .login-text {

            text-align: center;

            margin-top: 22px;

            color: #64748b;
        }

        .login-text a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {

            text-decoration: underline;
        }

        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;

            text-align: center;
        }

        .footer {

            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="icon">
                🤖
            </div>

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Join AI Interview Coach
            </p>

        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form
            action="/register"
            method="POST"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>

        <p class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

        <div class="footer">
            © 2026 AI Interview Coach
        </div>

    </div>

    <script>

        const form =
            document.querySelector("form");

        form.addEventListener(
            "submit",
            function(event) {

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirm_password"
                    ).value;

                if (password !== confirmPassword) {

                    event.preventDefault();

                    alert(
                        "Passwords do not match!"
                    );

                }

            }
        );

    </script>

</body>

</html>
```
