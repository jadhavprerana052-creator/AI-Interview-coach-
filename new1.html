<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Coach - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container small">

    <div class="card">

        <h1>AI Interview Coach</h1>

        <h2>Login</h2>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
