<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Question - AI Interview Coach</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .box {

            width: 600px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {

            margin-top: 0;

            color: #667eea;

            text-align: center;
        }

        label {

            display: block;

            margin-top: 20px;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        select,
        textarea {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        textarea {

            height: 130px;

            resize: none;
        }

        select:focus,
        textarea:focus {

            border-color: #667eea;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        ✏️ Edit Question
    </h1>


    <form
        method="POST"
        action="/edit_question/{{ question.id }}">


        <label>
            Select Job Role
        </label>


        <select
            name="role_id"
            required>

            {% for role in role_data %}

            <option
                value="{{ role.id }}"
                {% if role.id == question.role_id %}
                selected
                {% endif %}>

                {{ role.role_name }}

            </option>

            {% endfor %}

        </select>


        <label>
            Interview Question
        </label>


        <textarea
            name="question_text"
            required>{{ question.question_text }}</textarea>


        <button type="submit">

            💾 Update Question

        </button>


    </form>


    <a
        href="/questions"
        class="back">

        ← Back to Questions

    </a>


</div>


</body>

</html>
