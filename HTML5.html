```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview - Speech to Text</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 600px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            background: #f0f2ff;
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            font-size: 20px;
            line-height: 1.5;
        }

        .question span {
            color: #6366f1;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .mic {
            background: #ef4444;
        }

        .mic:hover {
            background: #dc2626;
        }

        .mic.recording {
            background: #991b1b;
            animation: pulse 1s infinite;
        }

        .clear {
            background: #64748b;
        }

        .next {
            background: #6366f1;
        }

        .status {
            text-align: center;
            margin-top: 18px;
            color: #555;
            min-height: 22px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239,68,68,0.6);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(239,68,68,0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239,68,68,0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Interview Coach</h1>

    <div class="question">
        <span>AI Question:</span>
        <br><br>

        Tell me about yourself and your professional background.
    </div>

    <textarea
        id="answer"
        placeholder="Your spoken answer will appear here..."
    ></textarea>

    <div class="buttons">

        <button
            class="mic"
            id="micButton"
            onclick="startSpeech()">

            🎤 Start Speaking

        </button>

        <button
            class="clear"
            onclick="clearAnswer()">

            🗑 Clear

        </button>

        <button
            class="next"
            onclick="nextQuestion()">

            ➡ Next Question

        </button>

    </div>

    <div
        class="status"
        id="status">

        Click the microphone and start speaking.

    </div>

</div>


<script>

    let recognition;

    let isListening = false;


    function startSpeech() {

        /*
         * Check browser support
         */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Speech-to-text is not supported in this browser. Please use Google Chrome."
            );

            return;
        }


        /*
         * Create speech recognition
         */

        recognition = new SpeechRecognition();


        /*
         * Language
         */

        recognition.lang = "en-US";


        /*
         * Continue listening while speaking
         */

        recognition.continuous = true;


        /*
         * Show partial text
         */

        recognition.interimResults = true;


        const micButton =
            document.getElementById("micButton");

        const status =
            document.getElementById("status");

        const answer =
            document.getElementById("answer");


        if (!isListening) {

            isListening = true;

            micButton.classList.add("recording");

            micButton.innerText =
                "🔴 Stop Speaking";

            status.innerText =
                "Listening... Speak your answer.";

            recognition.start();


            recognition.onresult =
                function(event) {

                    let finalText = "";

                    let interimText = "";


                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {

                        let transcript =
                            event.results[i][0].transcript;


                        if (
                            event.results[i].isFinal
                        ) {

                            finalText +=
                                transcript + " ";

                        } else {

                            interimText +=
                                transcript;

                        }

                    }


                    /*
                     * Put recognized speech
                     * into textarea
                     */

                    if (finalText) {

                        answer.value +=
                            finalText;

                    }


                    status.innerText =
                        "Listening: " +
                        interimText;

                };


            recognition.onerror =
                function(event) {

                    status.innerText =
                        "Error: " + event.error;

                    stopSpeech();

                };


            recognition.onend =
                function() {

                    if (isListening) {

                        try {

                            recognition.start();

                        } catch (error) {

                            console.log(error);

                        }

                    }

                };

        } else {

            stopSpeech();

        }

    }


    /*
     * Stop speech recognition
     */

    function stopSpeech() {

        isListening = false;


        if (recognition) {

            recognition.stop();

        }


        document
            .getElementById("micButton")
            .classList.remove("recording");


        document
            .getElementById("micButton")
            .innerText =
            "🎤 Start Speaking";


        document
            .getElementById("status")
            .innerText =
            "Speech recognition stopped.";

    }


    /*
     * Clear answer
     */

    function clearAnswer() {

        document
            .getElementById("answer")
            .value = "";

        document
            .getElementById("status")
            .innerText =
            "Answer cleared.";

    }


    /*
     * Next question
     */

    function nextQuestion() {

        let answer =
            document
            .getElementById("answer")
            .value
            .trim();


        if (answer === "") {

            alert(
                "Please answer the question first."
            );

            return;

        }


        /*
         * Save answer
         */

        localStorage.setItem(
            "interviewAnswer",
            answer
        );


        /*
         * Open next page
         */

        window.location.href =
            "next-question.html";

    }

</script>

</body>
</html>
