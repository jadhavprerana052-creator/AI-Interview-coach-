<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text - AI Interview Coach</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 600px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            background: #f0f2ff;

            padding: 20px;

            border-radius: 12px;

            margin: 25px 0;

            font-size: 19px;

            line-height: 1.5;
        }

        .question strong {
            color: #6366f1;
        }

        textarea {
            width: 100%;

            height: 180px;

            padding: 15px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            resize: none;

            outline: none;

            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 20px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        #startButton {
            background: #ef4444;
        }

        #startButton:hover {
            background: #dc2626;
        }

        #clearButton {
            background: #64748b;
        }

        #submitButton {
            background: #6366f1;
        }

        .listening {
            background: #991b1b !important;

            animation: pulse 1s infinite;
        }

        .status {
            text-align: center;

            margin-top: 20px;

            color: #555;

            min-height: 25px;
        }

        @keyframes pulse {

            0% {
                box-shadow: 0 0 0 0
                rgba(239,68,68,0.7);
            }

            70% {
                box-shadow: 0 0 0 15px
                rgba(239,68,68,0);
            }

            100% {
                box-shadow: 0 0 0 0
                rgba(239,68,68,0);
            }

        }

    </style>

</head>


<body>


<div class="box">

    <h1>🤖 AI Interview Coach</h1>


    <!-- QUESTION -->

    <div class="question">

        <strong>AI Question:</strong>

        <br><br>

        What are your strengths and weaknesses?

    </div>


    <!-- ANSWER -->

    <textarea
        id="answer"
        placeholder="Your spoken answer will appear here..."
    ></textarea>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            id="startButton"
            onclick="startSpeech()">

            🎤 Start Speaking

        </button>


        <button
            id="clearButton"
            onclick="clearText()">

            🗑 Clear

        </button>


        <button
            id="submitButton"
            onclick="submitAnswer()">

            ✓ Submit Answer

        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        Click "Start Speaking" and speak your answer.

    </div>

</div>


<script>

    let recognition;

    let isListening = false;


    /*
    ========================================
    SPEECH TO TEXT
    ========================================
    */

    function startSpeech() {


        /*
        Check browser support
        */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Speech-to-text is not supported in this browser. Please use Google Chrome."
            );

            return;

        }


        /*
        Stop if already listening
        */

        if (isListening) {

            stopSpeech();

            return;

        }


        /*
        Create Speech Recognition
        */

        recognition =
            new SpeechRecognition();


        /*
        Language
        */

        recognition.lang = "en-US";


        /*
        Keep listening
        */

        recognition.continuous = true;


        /*
        Show words while speaking
        */

        recognition.interimResults = true;


        isListening = true;


        const button =
            document.getElementById("startButton");

        const status =
            document.getElementById("status");


        button.innerText =
            "🔴 Stop Speaking";

        button.classList.add("listening");


        status.innerText =
            "Listening... Speak your answer.";


        /*
        Start microphone
        */

        recognition.start();


        /*
        When speech is detected
        */

        recognition.onresult =
            function(event) {


                let finalText = "";

                let temporaryText = "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {


                    let text =
                        event.results[i][0].transcript;


                    /*
                    Final recognized text
                    */

                    if (
                        event.results[i].isFinal
                    ) {

                        finalText += text + " ";

                    }


                    /*
                    Temporary text
                    */

                    else {

                        temporaryText += text;

                    }

                }


                /*
                Add converted speech
                to textarea
                */

                if (finalText !== "") {

                    document.getElementById("answer")
                        .value += finalText;

                }


                /*
                Display temporary recognition
                */

                if (temporaryText !== "") {

                    status.innerText =
                        "Listening: " +
                        temporaryText;

                }

            };


        /*
        Recognition stopped
        */

        recognition.onend =
            function() {


                /*
                Restart if user has not
                pressed Stop
                */

                if (isListening) {

                    try {

                        recognition.start();

                    }

                    catch(error) {

                        console.log(error);

                    }

                }

            };


        /*
        Error
        */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech error:",
                    event.error
                );


                if (
                    event.error === "not-allowed"
                ) {

                    status.innerText =
                        "❌ Microphone permission denied.";

                }

                else {

                    status.innerText =
                        "❌ Error: " +
                        event.error;

                }


                stopSpeech();

            };

    }


    /*
    ========================================
    STOP SPEECH
    ========================================
    */

    function stopSpeech() {

        isListening = false;


        if (recognition) {

            recognition.stop();

        }


        const button =
            document.getElementById("startButton");


        button.innerText =
            "🎤 Start Speaking";


        button.classList.remove("listening");


        document.getElementById("status")
            .innerText =
            "Speech converted to text successfully.";

    }


    /*
    ========================================
    CLEAR TEXT
    ========================================
    */

    function clearText() {

        document.getElementById("answer")
            .value = "";


        document.getElementById("status")
            .innerText =
            "Answer cleared.";

    }


    /*
    ========================================
    SUBMIT ANSWER
    ========================================
    */

    function submitAnswer() {


        if (isListening) {

            stopSpeech();

        }


        const answer =
            document.getElementById("answer")
                .value
                .trim();


        if (answer === "") {

            alert(
                "Please speak your answer first."
            );

            return;

        }


        /*
        Save answer in browser
        */

        localStorage.setItem(
            "interviewAnswer",
            answer
        );


        alert(
            "Your answer has been converted to text and submitted!"
        );


        /*
        Go to next question
        */

        window.location.href =
            "next-question.html";

    }

</script>


</body>

</html>
```
