<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview - Voice Answer</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 650px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            margin-top: 25px;
            padding: 20px;
            background: #f0f2ff;
            border-radius: 12px;
            color: #333;
            font-size: 20px;
            line-height: 1.5;
        }

        .question strong {
            color: #6366f1;
        }

        .answer-title {
            margin-top: 25px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 170px;
            margin-top: 10px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: none;
            outline: none;
            font-size: 16px;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .start {
            background: #ef4444;
            color: white;
        }

        .start:hover {
            background: #dc2626;
        }

        .stop {
            background: #991b1b;
            color: white;
        }

        .clear {
            background: #64748b;
            color: white;
        }

        .submit {
            background: #6366f1;
            color: white;
        }

        .status {
            text-align: center;
            margin-top: 18px;
            min-height: 25px;
            color: #555;
        }

        .recording {
            color: #ef4444;
            font-weight: bold;
        }

        .success {
            color: #16a34a;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .question {
                font-size: 18px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Interview Coach</h1>


    <!-- QUESTION -->

    <div class="question">

        <strong>AI Question:</strong>

        <br><br>

        Tell me about yourself and your professional background.

    </div>


    <!-- ANSWER -->

    <div class="answer-title">

        🎤 Your Answer

    </div>


    <textarea
        id="answer"
        placeholder="Click 'Start Speaking' and speak your answer..."
    ></textarea>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="start"
            id="micButton"
            onclick="startListening()">

            🎤 Start Speaking

        </button>


        <button
            class="clear"
            onclick="clearAnswer()">

            🗑 Clear

        </button>


        <button
            class="submit"
            onclick="submitAnswer()">

            ➡ Submit Answer

        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        Click the microphone to answer.

    </div>

</div>


<script>

    let recognition;

    let listening = false;


    /*
     * START VOICE RECOGNITION
     */

    function startListening() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        /*
         * Check browser support
         */

        if (!SpeechRecognition) {

            alert(
                "Speech recognition is not supported. Please use Google Chrome."
            );

            return;
        }


        /*
         * If already listening,
         * stop it.
         */

        if (listening) {

            stopListening();

            return;
        }


        recognition = new SpeechRecognition();


        /*
         * English language
         */

        recognition.lang = "en-US";


        /*
         * Keep listening
         */

        recognition.continuous = true;


        /*
         * Show temporary results
         */

        recognition.interimResults = true;


        const micButton =
            document.getElementById("micButton");

        const status =
            document.getElementById("status");

        const answer =
            document.getElementById("answer");


        listening = true;


        micButton.innerText =
            "🔴 Stop Speaking";

        micButton.className =
            "stop";


        status.innerText =
            "🔴 Listening... Please speak your answer.";

        status.className =
            "status recording";


        recognition.start();


        /*
         * RECEIVE SPEECH
         */

        recognition.onresult =
            function(event) {

                let finalTranscript = "";

                let interimTranscript = "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const transcript =
                        event.results[i][0].transcript;


                    if (
                        event.results[i].isFinal
                    ) {

                        finalTranscript +=
                            transcript + " ";

                    } else {

                        interimTranscript +=
                            transcript;

                    }

                }


                /*
                 * Add final speech to textarea
                 */

                if (finalTranscript !== "") {

                    answer.value +=
                        finalTranscript;

                }


                /*
                 * Show temporary speech
                 */

                if (interimTranscript !== "") {

                    status.innerText =
                        "Listening: " +
                        interimTranscript;

                }

            };


        /*
         * Recognition ended
         */

        recognition.onend =
            function() {

                if (listening) {

                    try {

                        recognition.start();

                    } catch (error) {

                        console.log(error);

                    }

                }

            };


        /*
         * Error handling
         */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition error:",
                    event.error
                );


                if (
                    event.error === "not-allowed"
                ) {

                    status.innerText =
                        "❌ Microphone permission denied.";

                } else {

                    status.innerText =
                        "❌ Error: " +
                        event.error;

                }


                stopListening();

            };

    }


    /*
     * STOP LISTENING
     */

    function stopListening() {

        listening = false;


        if (recognition) {

            recognition.stop();

        }


        const micButton =
            document.getElementById("micButton");


        micButton.innerText =
            "🎤 Start Speaking";

        micButton.className =
            "start";


        const status =
            document.getElementById("status");


        status.innerText =
            "Voice recording stopped.";

        status.className =
            "status success";

    }


    /*
     * CLEAR ANSWER
     */

    function clearAnswer() {

        document.getElementById("answer").value = "";

        document.getElementById("status").innerText =
            "Answer cleared.";

    }


    /*
     * SUBMIT ANSWER
     */

    function submitAnswer() {

        /*
         * Stop microphone first
         */

        if (listening) {

            stopListening();

        }


        const answer =
            document
                .getElementById("answer")
                .value
                .trim();


        if (answer === "") {

            alert(
                "Please speak or type an answer first."
            );

            return;

        }


        /*
         * Save answer
         */

        localStorage.setItem(
            "userInterviewAnswer",
            answer
        );


        alert(
            "Answer submitted successfully!"
        );


        /*
         * Go to next question
         */

        window.location.href =
            "next-question.html";

    }

</script>

</body>
</html>
```
