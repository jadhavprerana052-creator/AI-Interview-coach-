<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Converted Answer - AI Interview Coach</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 650px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .question {
            background: #f0f2ff;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;

            font-size: 18px;

            line-height: 1.5;
        }

        .question strong {
            color: #6366f1;
        }

        .answer-title {
            font-size: 18px;

            font-weight: bold;

            color: #333;

            margin-bottom: 10px;
        }

        .converted-answer {
            width: 100%;

            min-height: 180px;

            padding: 20px;

            background: #f8fafc;

            border: 2px solid #22c55e;

            border-radius: 12px;

            color: #333;

            font-size: 17px;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .success {
            text-align: center;

            color: #16a34a;

            font-weight: bold;

            margin-top: 15px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 25px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .edit {
            background: #64748b;
        }

        .next {
            background: #6366f1;
        }

        .feedback {
            background: #16a34a;
        }

        button:hover {
            opacity: 0.9;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>🤖 AI Interview Coach</h1>


    <!-- INTERVIEW QUESTION -->

    <div class="question">

        <strong>Interview Question:</strong>

        <br><br>

        What are your strengths and weaknesses?

    </div>


    <!-- CONVERTED ANSWER -->

    <div class="answer-title">

        📝 Converted Answer

    </div>


    <div
        class="converted-answer"
        id="convertedAnswer">

        No answer recorded yet.

    </div>


    <div
        class="success"
        id="successMessage">

        ✓ Speech converted to text

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="edit"
            onclick="editAnswer()">

            ✏️ Edit Answer

        </button>


        <button
            class="next"
            onclick="nextQuestion()">

            ➡ Next Question

        </button>


        <button
            class="feedback"
            onclick="viewFeedback()">

            📊 View Feedback

        </button>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     याच HTML FILE मध्ये JavaScript आहे
     ========================================= -->

<script>

    /*
    =========================================
    1. CONVERTED ANSWER LOAD करा
    =========================================
    */

    function loadAnswer() {

        /*
        Speech-to-text page ने save केलेला
        answer localStorage मधून घेणे
        */

        let answer =
            localStorage.getItem("interviewAnswer");


        /*
        Answer मिळाला असेल तर screen वर दाखवा
        */

        if (
            answer &&
            answer.trim() !== ""
        ) {

            document.getElementById(
                "convertedAnswer"
            ).innerText = answer;


            document.getElementById(
                "successMessage"
            ).innerText =
                "✓ Speech successfully converted to text";

        }

        else {

            document.getElementById(
                "convertedAnswer"
            ).innerText =
                "No answer recorded yet.";


            document.getElementById(
                "successMessage"
            ).innerText =
                "⚠ No speech-to-text answer found.";

        }

    }


    /*
    =========================================
    2. EDIT ANSWER
    =========================================
    */

    function editAnswer() {

        let oldAnswer =
            document.getElementById(
                "convertedAnswer"
            ).innerText;


        let newAnswer =
            prompt(
                "Edit your answer:",
                oldAnswer
            );


        /*
        User ने answer बदलला तर
        */

        if (
            newAnswer !== null &&
            newAnswer.trim() !== ""
        ) {

            document.getElementById(
                "convertedAnswer"
            ).innerText =
                newAnswer;


            /*
            नवीन answer save करा
            */

            localStorage.setItem(
                "interviewAnswer",
                newAnswer
            );

        }

    }


    /*
    =========================================
    3. NEXT QUESTION
    =========================================
    */

    function nextQuestion() {

        /*
        पुढच्या question page वर जा
        */

        window.location.href =
            "next-question.html";

    }


    /*
    =========================================
    4. FEEDBACK PAGE
    =========================================
    */

    function viewFeedback() {

        /*
        Feedback page उघडा
        */

        window.location.href =
            "feedback.html";

    }


    /*
    =========================================
    5. PAGE LOAD झाल्यावर ANSWER दाखवा
    =========================================
    */

    loadAnswer();

</script>


</body>

</html>
```
