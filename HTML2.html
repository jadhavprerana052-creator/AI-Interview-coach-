```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview Coach</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 5px rgba(99,102,241,0.3);
        }

        .interview-types {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .type-option {
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .type-option:hover {
            border-color: #6366f1;
            background: #f5f5ff;
        }

        .type-option input {
            display: none;
        }

        .type-option.selected {
            border-color: #6366f1;
            background: #eef0ff;
            color: #4f46e5;
        }

        .icon {
            font-size: 25px;
            display: block;
            margin-bottom: 5px;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: #4f46e5;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .container {
                width: 90%;
                padding: 25px;
            }

            .interview-types {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🤖</div>

    <h1>AI Interview Coach</h1>

    <p class="subtitle">
        Select your job role and interview type
    </p>

    <form onsubmit="startInterview(event)">

        <!-- JOB ROLE -->
        <div class="form-group">

            <label for="jobRole">
                💼 Select Job Role
            </label>

            <select id="jobRole" required>

                <option value="">
                    -- Select Job Role --
                </option>

                <option value="software-developer">
                    Software Developer
                </option>

                <option value="web-developer">
                    Web Developer
                </option>

                <option value="frontend-developer">
                    Frontend Developer
                </option>

                <option value="backend-developer">
                    Backend Developer
                </option>

                <option value="full-stack-developer">
                    Full Stack Developer
                </option>

                <option value="data-scientist">
                    Data Scientist
                </option>

                <option value="data-analyst">
                    Data Analyst
                </option>

                <option value="ai-engineer">
                    AI / ML Engineer
                </option>

                <option value="cyber-security">
                    Cyber Security
                </option>

                <option value="software-tester">
                    Software Tester / QA
                </option>

                <option value="hr">
                    Human Resources
                </option>

                <option value="marketing">
                    Marketing
                </option>

                <option value="finance">
                    Finance
                </option>

            </select>

        </div>


        <!-- INTERVIEW TYPE -->
        <div class="form-group">

            <label>
                🎯 Select Interview Type
            </label>

            <div class="interview-types">

                <label class="type-option">

                    <input
                        type="radio"
                        name="interviewType"
                        value="technical"
                        onchange="selectType(this)"
                    >

                    <span class="icon">💻</span>

                    Technical

                </label>


                <label class="type-option">

                    <input
                        type="radio"
                        name="interviewType"
                        value="hr"
                        onchange="selectType(this)"
                    >

                    <span class="icon">👥</span>

                    HR Interview

                </label>


                <label class="type-option">

                    <input
                        type="radio"
                        name="interviewType"
                        value="behavioral"
                        onchange="selectType(this)"
                    >

                    <span class="icon">🧠</span>

                    Behavioral

                </label>


                <label class="type-option">

                    <input
                        type="radio"
                        name="interviewType"
                        value="mixed"
                        onchange="selectType(this)"
                    >

                    <span class="icon">🎯</span>

                    Mixed Interview

                </label>

            </div>

        </div>


        <!-- BUTTON -->

        <button type="submit" class="start-btn">
            🚀 Start Mock Interview
        </button>

        <div id="message" class="message"></div>

    </form>

</div>


<script>

    function selectType(input) {

        // Remove selected class from all options
        let options = document.querySelectorAll(".type-option");

        options.forEach(function(option) {
            option.classList.remove("selected");
        });

        // Add selected class
        input.parentElement.classList.add("selected");
    }


    function startInterview(event) {

        event.preventDefault();

        let jobRole = document.getElementById("jobRole").value;

        let interviewType =
            document.querySelector(
                'input[name="interviewType"]:checked'
            );

        let message = document.getElementById("message");


        if (jobRole === "") {

            message.style.color = "red";
            message.innerHTML = "Please select a job role.";

            return;
        }


        if (!interviewType) {

            message.style.color = "red";
            message.innerHTML =
                "Please select an interview type.";

            return;
        }


        let selectedRole =
            document.getElementById("jobRole")
            .options[
                document.getElementById("jobRole").selectedIndex
            ].text;

        let selectedType =
            interviewType.value;


        message.style.color = "green";

        message.innerHTML =
            "Starting " +
            selectedType +
            " interview for " +
            selectedRole +
            "...";


        // Redirect to interview page after 1 second
        setTimeout(function() {

            window.location.href = "interview.html";

        }, 1000);

    }

</script>

</body>
</html>
```
